version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of go.mod
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/internal/dev_server/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # @launchpad-ui/core 0.57+ requires React 19; the UI is on React 18.3.1.
      - dependency-name: "@launchpad-ui/core"
        versions: [">=0.57"]
