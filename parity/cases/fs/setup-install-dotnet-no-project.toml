id = "setup-install-dotnet-no-project"
argv = ["setup", "install", "--sdk-id", "dotnet-server-sdk"]
declare = ["config:ldcli/config.yml", "work:App.sln"]
rust = true

[seed]
"bin:dotnet" = "#!/bin/sh\necho ok\n"
"work:App.sln" = ""

[expect]
status = 0
stdout_file = "setup-install-dotnet-no-project.stdout"
stderr_file = "setup-install-dotnet-no-project.stderr"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
"work:App.sln" = ""
