id = "setup-install-tool-killed"
argv = ["setup", "install", "--sdk-id", "node-server", "--package-manager", "npm"]
declare = ["config:ldcli/config.yml"]
rust = true

[seed]
"bin:npm" = "#!/bin/sh\nkill -9 $$\n"

[expect]
status = 1
stdout_file = "setup-install-tool-killed.stdout"
stderr_file = "setup-install-tool-killed.stderr"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
