id = "setup-detect-android"
argv = ["setup", "detect"]
declare = ["config:ldcli/config.yml", "work:app/src/main/java/com/example/MainActivity.java", "work:build.gradle"]
rust = true

[seed]
"work:app/src/main/java/com/example/MainActivity.java" = "class MainActivity {}\n"
"work:build.gradle" = "apply plugin: 'com.android.application'\n"

[expect]
status = 0
stdout_file = "setup-detect-android.stdout"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
"work:app/src/main/java/com/example/MainActivity.java" = "class MainActivity {}\n"
"work:build.gradle" = "apply plugin: 'com.android.application'\n"
