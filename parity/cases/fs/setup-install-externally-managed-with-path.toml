id = "setup-install-externally-managed-with-path"
argv = ["setup", "install", "--sdk-id", "python-server-sdk", "--package-manager", "pip", "--path", "sub"]
declare = ["config:ldcli/config.yml", "work:sub/requirements.txt"]
rust = true

[seed]
"bin:pip" = "#!/bin/sh\necho 'error: externally-managed-environment'\nexit 1\n"
"work:sub/requirements.txt" = ""

[expect]
status = 0
stdout_file = "setup-install-externally-managed-with-path.stdout"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
"work:sub/requirements.txt" = ""
