id = "setup-install-tool-terminated"
argv = ["setup", "install", "--sdk-id", "node-server", "--package-manager", "yarn"]
declare = ["config:ldcli/config.yml"]
rust = true

[seed]
"bin:yarn" = "#!/bin/sh\necho partial\nkill -15 $$\n"

[expect]
status = 1
stdout_file = "setup-install-tool-terminated.stdout"
stderr_file = "setup-install-tool-terminated.stderr"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
