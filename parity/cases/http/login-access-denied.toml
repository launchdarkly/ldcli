id = "login-access-denied"
argv = ["login", "--base-uri", "{{BASE_URI}}"]
declare = ["config:ldcli/config.yml"]
rust = true
redact = ["hostname"]

[[http]]
method = "POST"
path = "/internal/device-authorization"
status = 200
body = "{\"deviceCode\": \"{{DEVICE_CODE}}\", \"expiresIn\": 900, \"userCode\": \"{{USER_CODE}}\", \"verificationUri\": \"{{VERIFICATION_URI}}\"}"

[[http]]
method = "POST"
path = "/internal/device-authorization/token"
status = 400
body = "{\"code\": \"access_denied\", \"message\": \"the user said no\"}"

[expect]
status = 1
stdout_file = "login-access-denied.stdout"
stderr_file = "login-access-denied.stderr"
requests_file = "login-access-denied.requests"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
