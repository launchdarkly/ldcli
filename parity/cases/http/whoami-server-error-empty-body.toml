id = "whoami-server-error-empty-body"
argv = ["whoami", "--base-uri", "{{BASE_URI}}", "-o", "plaintext"]
declare = ["config:ldcli/config.yml"]
rust = true

[env]
LD_ACCESS_TOKEN = "{{ACCESS_TOKEN}}"

[[http]]
method = "GET"
path = "/api/v2/caller-identity"
status = 500
body = ""

[expect]
status = 1
stdout_file = "whoami-server-error-empty-body.stdout"
stderr_file = "whoami-server-error-empty-body.stderr"
requests_file = "whoami-server-error-empty-body.requests"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
