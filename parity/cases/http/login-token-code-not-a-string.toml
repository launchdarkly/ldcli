id = "login-token-code-not-a-string"
argv = ["login", "--base-uri", "{{BASE_URI}}"]
declare = ["config:ldcli/config.yml"]
redact = ["hostname"]
rust = true

[[http]]
method = "POST"
path = "/internal/device-authorization"
status = 200
body = "{\"deviceCode\": \"{{DEVICE_CODE}}\", \"expiresIn\": 900, \"userCode\": \"{{USER_CODE}}\", \"verificationUri\": \"{{VERIFICATION_URI}}\"}"

[[http]]
method = "POST"
path = "/internal/device-authorization/token"
status = 400
body = "{\"code\": 7, \"message\": \"numeric code\"}"

[expect]
status = 1
stdout_file = "login-token-code-not-a-string.stdout"
stderr_file = "login-token-code-not-a-string.stderr"
requests_file = "login-token-code-not-a-string.requests"

[expect.files]
"config:ldcli/config.yml" = "{}\n"
