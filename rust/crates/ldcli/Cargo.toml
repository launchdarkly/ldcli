[package]
name = "ldcli"
version = "0.1.0"
edition = "2021"
publish = false
description = "LaunchDarkly CLI"

[lib]
name = "ldcli"
path = "src/lib.rs"

[[bin]]
name = "ldcli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
