# Cache bust: golangci-lint v2.9.0 for Go 1.26.10
repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.9.0
    hooks:
      - id: golangci-lint
        entry: golangci-lint run
        language: golang
        require_serial: true
        types: [go]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        # The golden R8 index is binary, and the fixer cannot tell. A newline
        # appended to it moves the footer the reader locates the index by.
        exclude: \.index$
