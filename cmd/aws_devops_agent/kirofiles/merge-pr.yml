name: Merge Experiment Pull Request

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to merge"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pull request number"
            exit 1
          fi
          # Only merge PRs opened by the Kiro experiment workflow, which pushes
          # from branches named experiment/<flag>-<run-id>.
          HEAD_REF=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefName --jq .headRefName)
          if [[ ! "$HEAD_REF" =~ ^experiment/ ]]; then
            echo "::error::PR #$PR_NUMBER head branch '$HEAD_REF' is not an experiment/* branch"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch
